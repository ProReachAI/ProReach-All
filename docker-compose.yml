services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketing_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketing_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - marketing_agent_postgres:/var/lib/postgresql/data

volumes:
  marketing_agent_postgres:
