<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>ProReach dark-background mark</title>
  <desc>Reversed ProReach P mark with coral and lime growth paths for use on dark backgrounds.</desc>

  <!-- Reversed P body: warm white remains visible on the near-black website. -->
  <path
    d="M18 12H58C78.2 12 92 25.3 92 44C92 62.7 78.2 76 58 76H45L55 62H58C69.4 62 77 54.8 77 44C77 33.2 69.4 26 58 26H34V57L18 73V12Z"
    fill="#F8F3E8"
  />

  <!-- Dark route and arrow create the central negative-space movement. -->
  <path d="M20 82L51 51V33H43L59 17L75 33H67V58L31 94H20V82Z" fill="#0A0B12" />

  <!-- Original brand accents are retained rather than inverted. -->
  <path d="M20 94H31V84L58 57L51 50L20 81V94Z" fill="#FF5D42" />
  <path d="M47 94H58V66L67 57V33H58V53L47 64V94Z" fill="#BFFF45" />
</svg>
